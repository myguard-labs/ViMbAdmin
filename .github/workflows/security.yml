name: Security scan (SAST)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly re-scan so new Semgrep rules catch latent issues.
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF to the GitHub Security tab

concurrency:
  group: sast-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    # CodeQL has no PHP support; Semgrep is the SAST engine for this codebase.
    container:
      image: >-
        semgrep/semgrep@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh

      - name: Trust checkout for Semgrep Git operations
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null

      - name: Test Semgrep baseline event policy
        run: bash tests/test-semgrep-baseline.sh

      - name: Test immutable Semgrep rule policy
        run: python3 tests/test-semgrep-rule-lock.py

      - name: Verify locked Semgrep findings fail the job (negative control)
        id: semgrep_locked_negative
        if: github.event_name == 'pull_request'
        run: >-
          bash .github/scripts/assert-semgrep-findings.sh
          --config .semgrep/locked

      - name: Verify current Semgrep findings fail the job (negative control)
        id: semgrep_current_negative
        if: github.event_name != 'pull_request'
        run: >-
          bash .github/scripts/assert-semgrep-findings.sh
          --config p/php
          --config p/security-audit
          --config p/secrets

      - name: Run locked Semgrep rules for pull requests
        id: semgrep_locked
        if: github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          baseline=$(bash .github/scripts/select-semgrep-baseline.sh \
            "$EVENT_NAME" "$PR_BASE_SHA" "$BEFORE_SHA" "$HEAD_SHA")
          baseline_args=()
          if [[ -n $baseline ]]; then
            baseline_args=(--baseline-commit "$baseline")
          fi
          semgrep scan \
            --config .semgrep/locked \
            --exclude '.semgrep/locked/**' \
            --sarif --output semgrep.sarif \
            "${baseline_args[@]}" \
            --error

      - name: Run current Semgrep rules outside pull requests
        id: semgrep_current
        if: github.event_name != 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          baseline=$(bash .github/scripts/select-semgrep-baseline.sh \
            "$EVENT_NAME" "$PR_BASE_SHA" "$BEFORE_SHA" "$HEAD_SHA")
          baseline_args=()
          if [[ -n $baseline ]]; then
            baseline_args=(--baseline-commit "$baseline")
          fi
          semgrep scan \
            --config p/php \
            --config p/security-audit \
            --config p/secrets \
            --exclude '.semgrep/locked/**' \
            --sarif --output semgrep.sarif \
            "${baseline_args[@]}" \
            --error

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # yamllint disable-line rule:line-length
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: semgrep.sarif
          category: semgrep
