---
name: Static analysis

on:  # yamllint disable-line rule:truthy
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stan-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: PHPStan
    runs-on: ["self-hosted-run-${{ github.run_id }}-${{ github.run_attempt }}", "vimbadmin-owned-local-v1-run-${{ github.run_id }}-${{ github.run_attempt }}", "docker-run-${{ github.run_id }}-${{ github.run_attempt }}", "jit-env-input-run-${{ github.run_id }}-${{ github.run_attempt }}", "vimbadmin-pristine-jit-v1-run-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 20
    container:
      # Published after reset; placement metadata only, never host credentials.
      volumes:
        - /run/myguard-ci-slot:/run/myguard-ci-slot:ro
      image: >-
        mirror.gcr.io/library/php@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3
    # The complete project targets PHPStan level 10. Existing debt is generated
    # into one baseline, which CI verifies has no stale or hand-edited drift.
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git python3

      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Trust checkout for tracked-file and base operations
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null

      - name: Select immutable PHPStan base
        env:
          PHPSTAN_PULL_REQUEST_BASE_SHA: >-
            ${{ github.event.pull_request.base.sha }}
          PHPSTAN_PUSH_BEFORE_SHA: ${{ github.event.before }}
          PHPSTAN_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PHPSTAN_PULL_REQUEST_BASE_SHA" ;;
            push) base="$PHPSTAN_PUSH_BEFORE_SHA" ;;
            workflow_dispatch) base="$PHPSTAN_WORKFLOW_SHA" ;;
            *)
              echo "PHPStan immutable base revision is unavailable for" \
                "$GITHUB_EVENT_NAME" >&2
              exit 2
              ;;
          esac
          if [ -z "$base" ]; then
            echo "PHPStan immutable base revision is unavailable" >&2
            exit 2
          fi
          printf 'PHPSTAN_BASE_SHA=%s\n' "$base" >>"$GITHUB_ENV"

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh
        env:
          PR_RUNNER_EXPECTED_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}

      # The merge ref can omit its event-time base object when the base branch
      # moves before this job starts. Fetch that immutable object explicitly so
      # the ratchet compares against the reviewed base, not a moving ref.
      - name: Fetch PHPStan pull-request base
        if: github.event_name == 'pull_request'
        env:
          PHPSTAN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$PHPSTAN_BASE_SHA"
          git cat-file -e "${PHPSTAN_BASE_SHA}^{commit}"

      - name: Setup PHP container
        run: bash .github/scripts/setup-php-container.sh phpstan

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Assert every tracked PHP test has a CI owner
        run: bash tests/assert-regression-coverage.sh

      - name: Regression coverage guard self-test
        run: bash tests/test-assert-regression-coverage.sh

      # Proxies are gitignored + built at image time; generate them here so this
      # job also verifies bin/generate-proxies.php keeps working (no DB needed).
      - name: Generate Doctrine proxies
        run: php bin/generate-proxies.php

      - name: Test PHPStan ratchet
        run: bash tests/run-phpstan-tests.sh

      - name: PHPStan configuration contract self-test
        run: bash ci/test-phpstan-config-contract.sh

      - name: Reconcile tracked PHP files with PHPStan coverage
        run: bash ci/reconcile-phpstan-coverage.sh

      - name: Run PHPStan
        env:
          PHPSTAN_EVENT_BEFORE: ${{ github.event.before }}
        run: bash tests/lint-phpstan-ratchet.sh

  psalm-taint:
    name: Psalm taint analysis
    runs-on: ["self-hosted-run-${{ github.run_id }}-${{ github.run_attempt }}", "vimbadmin-owned-local-v1-run-${{ github.run_id }}-${{ github.run_attempt }}", "docker-run-${{ github.run_id }}-${{ github.run_attempt }}", "jit-env-input-run-${{ github.run_id }}-${{ github.run_attempt }}", "vimbadmin-pristine-jit-v1-run-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 20
    container:
      # Published after reset; placement metadata only, never host credentials.
      volumes:
        - /run/myguard-ci-slot:/run/myguard-ci-slot:ro
      image: >-
        mirror.gcr.io/library/php@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git python3

      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh
        env:
          PR_RUNNER_EXPECTED_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP container
        run: bash .github/scripts/setup-php-container.sh psalm

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate Doctrine proxies
        run: php bin/generate-proxies.php

      - name: Verify Psalm taint baseline regeneration
        run: |
          bash tests/test-regenerate-psalm-taint-baseline.sh
          bash tests/test-psalm-taint-contract.sh
          bash tests/regenerate-psalm-taint-baseline.sh --check

      - name: Psalm excludes generated proxies
        run: bash ci/test-psalm-proxies-ignored.sh

      - name: Verify optional Psalm client models
        run: bash ci/test-psalm-optional-model-contract.sh

      - name: Psalm taint analysis
        run: psalm --no-progress --taint-analysis

  php-cs-fixer:
    name: PSR-12 formatting
    runs-on: ["self-hosted-run-${{ github.run_id }}-${{ github.run_attempt }}", "vimbadmin-owned-local-v1-run-${{ github.run_id }}-${{ github.run_attempt }}", "docker-run-${{ github.run_id }}-${{ github.run_attempt }}", "jit-env-input-run-${{ github.run_id }}-${{ github.run_attempt }}", "vimbadmin-pristine-jit-v1-run-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 10
    container:
      # Published after reset; placement metadata only, never host credentials.
      volumes:
        - /run/myguard-ci-slot:/run/myguard-ci-slot:ro
      image: >-
        mirror.gcr.io/library/php@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3
    # The formatting contract lives in .php-cs-fixer.dist.php with risky fixers
    # disabled, so this job may only ever disagree about whitespace and braces.
    # It parses sources directly and needs neither Composer nor proxies.
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git python3

      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Trust checkout for formatter source selection
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh
        env:
          PR_RUNNER_EXPECTED_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP container
        run: bash .github/scripts/setup-php-container.sh formatter

      - name: Formatting contract self-test
        run: bash tests/test-php-cs-fixer-contract.sh

      - name: Formatter Git enumeration failure control
        run: bash ci/test-formatter-git-failure.sh

      - name: Formatter source selection regression
        run: php ci/test-formatter-selection.php

      - name: PSR-12 formatting check
        run: php-cs-fixer check --diff --show-progress=none

  refactor-metrics:
    name: Tracked refactor metrics contract
    runs-on: ["self-hosted-run-${{ github.run_id }}-${{ github.run_attempt }}", "vimbadmin-owned-local-v1-run-${{ github.run_id }}-${{ github.run_attempt }}", "docker-run-${{ github.run_id }}-${{ github.run_attempt }}", "jit-env-input-run-${{ github.run_id }}-${{ github.run_attempt }}", "vimbadmin-pristine-jit-v1-run-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 10
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh
        env:
          PR_RUNNER_EXPECTED_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}

      # actions/setup-node v6.3.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install PHP lexer and pinned clone detector
        run: |
          sudo apt-get update
          sudo apt-get install --yes php-cli python3
          npm ci --ignore-scripts --prefix ci/refactor-metrics
          echo "$PWD/ci/refactor-metrics/node_modules/.bin" >>"$GITHUB_PATH"

      - name: Refactor metrics contract regression
        run: bash ci/test-refactor-metrics.sh

      - name: PHP setup profile selection regression
        run: python3 ci/test-php-setup-profiles.py

      - name: Checkout immutable structural rule corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: myguard-labs/ast-grep-essentials
          ref: 9025c0dd887d7a6797352b6d7ab5db6ba58d4603
          path: .ci-ast-grep-corpus
          persist-credentials: false

      - name: Install locked structural scan engine
        run: npm ci --ignore-scripts --prefix .ci-ast-grep-corpus

      - name: Structural scan execution and failure controls
        run: python3 ci/test-ast-grep.py --corpus .ci-ast-grep-corpus

      # Structural matches are review candidates, as in local pre-commit.
      # Tool/configuration errors and incomplete source coverage fail the job.
      - name: Scan tracked sources with ast-grep
        run: >-
          python3 ci/run-ast-grep.py --corpus .ci-ast-grep-corpus
          --output "${RUNNER_TEMP:?}/ast-grep-report"

      - name: Preserve complete structural finding locations and coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ast-grep-candidates
          path: ${{ runner.temp }}/ast-grep-report/report.json
          if-no-files-found: error
          retention-days: 14
