---
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP syntax lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            image: >-
              mirror.gcr.io/library/php@sha256:6cb44388b6ffc8c9a35b4cfdf518d0565e0cf9150e479add338b498874d7e971
          - php: '8.4'
            image: >-
              mirror.gcr.io/library/php@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3
          - php: '8.5'
            image: >-
              mirror.gcr.io/library/php@sha256:19667d836740e24a3ba340532c7349ab59bb961b86f20e3c85a58150644e5e55
          - php: '8.6'
            image: >-
              mirror.gcr.io/library/php@sha256:10335e12340a170d0c49d98829c65a827df6bd6d2ad8a6ee08b030e8fca31163
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh

      - name: Test pull-request runner isolation policy
        run: bash tests/test-pr-runner-isolation.sh

      - name: Setup container tools
        run: bash .github/scripts/setup-php-container.sh tools

      - name: Assert workflow runtime contract
        run: bash .github/scripts/assert-workflow-runtime.sh

      - name: Workflow runtime contract self-test
        run: bash tests/test-assert-workflow-runtime.sh

      - name: Test dependency refresh contracts
        run: php ci/test-dependency-refresh.php

      - name: Check dependency refresh for Dependabot
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          DEPENDENCY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/check-dependency-refresh.sh

      - name: Validate composer.json / composer.lock
        run: |
          composer validate --strict
          php .github/scripts/assert-composer-lock.php

      - name: PHP syntax check
        run: bash ci/check-php-syntax.sh

      - name: Verify batched syntax checks and failure controls
        if: matrix.php == '8.3'
        run: bash ci/test-php-syntax-batching.sh

      - name: PHP extension setup fails closed and removes temporary sources
        if: matrix.php == '8.3'
        run: bash ci/test-apcu-provision.sh

  audit:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: >-
        mirror.gcr.io/library/php@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh

      - name: Setup container tools
        run: bash .github/scripts/setup-php-container.sh tools

      # --locked reads composer.lock directly (no composer install needed in
      # this job); composer.json makes abandoned packages reportable findings.
      - name: composer audit
        run: composer audit --locked
