---
name: Regression tests

on:  # yamllint disable-line rule:truthy
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reg-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Pinned browser asset regeneration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh

      - name: PR runner job count reports observed and expected values
        run: bash ci/test-pr-runner-isolation-count.sh

      - name: Install pinned asset toolchain
        run: |
          compiler_url=https://repo1.maven.org/maven2/com/google/javascript/closure-compiler/
          compiler_url+=v20230802/closure-compiler-v20230802.jar
          curl --fail --silent --show-error --location \
            "$compiler_url" \
            --output bin/compiler.jar
          printf '%s  %s\n' \
            230a9e05a8a7d9daa083b1f6e86edba6eb1ec6402a6a258432fe4245cdc4a95f \
            bin/compiler.jar | sha256sum --check
          npm ci --prefix bin --ignore-scripts

      - name: Regenerate and compare committed browser assets
        run: |
          bash tests/test-minify-tool-selection.sh
          bash tests/test-minify-tool-selection-negative-control.sh
          bash tests/test-pinned-asset-regeneration.sh

  # ------------------------------------------------------------------ #
  # Static/browser regressions — no DB. Fast first signal.             #
  # ------------------------------------------------------------------ #
  static:
    name: Static and browser regression (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      VIMBADMIN_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh

      - name: Bundle resolver preserves inherited shell options
        run: bash tests/test-resolve-bundle-v.sh

      - name: Shipped JS bundle retains UTF-8 licence attribution
        run: php ci/test-bundle-utf8.php

      - name: JS minifier preserves UTF-8 charset through the shipped bundle
        run: php tests/test-minify-bundle-charset.php

      - name: Smarty 5 JS-template escaping (alias [+] button regression)
        run: bash tests/lint-template-escaping.sh

      - name: ZF1 surface must not grow (Phase 0 guard, docs/ZF1-REMOVAL.md)
        run: bash tests/lint-no-new-zend.sh

      - name: Documentation matches shipped ownership and configuration
        run: php tests/test-documentation-contract.php

      - name: 2FA session-hygiene invariants (audit 2026-07-10 MAJOR)
        run: bash tests/lint-2fa-session-hygiene.sh

      - name: Bootstrap 2 grid classes must not reappear (VIM-A15 phase 4)
        run: bash tests/lint-bs2-grid-classes.sh

      - name: Bootstrap 2 component classes must not reappear (VIM-A15.19)
        run: bash tests/lint-bs2-component-classes.sh

      - name: Lint gates must be working-directory independent (VIM-A15.31)
        run: bash tests/test-lint-gate-cwd-independence.sh

      - name: Bootstrap data attributes must use bs- prefix (VIM-A15.20)
        run: bash tests/lint-bs5-data-attrs.sh

      - name: Static modals must be labelled for assistive tech (VIM-A15.32)
        run: bash tests/lint-modal-aria-labelledby.sh

      - name: Glyphicons icon-* classes must not reappear (VIM-A15.18)
        run: bash tests/lint-no-glyphicon-classes.sh

      - name: DataTables dom/sDom rejects BS2 grid tokens (VIM-A15.23)
        run: bash tests/lint-datatables-bs5-dom.sh

      - name: DataTables extension names must be registered (VIM-A15.23)
        run: bash tests/lint-datatables-registered-plugins.sh

      - name: fnServerData initialisers must keep sAjaxSource (VIM-A15.26)
        run: bash tests/lint-datatables-serverdata-source.sh

      - name: DataTables clear() must chain its redraw (VIM-A15.56a)
        run: bash tests/lint-datatables-clear-redraws.sh

      - name: DataTables search uses native active transports
        run: node tests/test-datatable-search-row-api.cjs

      - name: Request helper behavior remains source and bundle equivalent
        run: node ci/test-refactor-ui-events.cjs

      - name: Containerized Chrome runner hardening
        run: >-
          VIMBADMIN_BROWSER=chrome bash tests/test-headless-chrome-container.sh

      - name: Build pinned browser fixture image
        run: docker build -t vimbadmin-browser:1.63.0 .github/scripts/browser

      - name: Browser adapter identity and fail-closed contract
        run: bash tests/test-browser-fixture-adapter.sh

      - name: Fixture HTTP readiness stays bounded (VIM-A15.16 round-3 defect)
        run: bash tests/test-fixture-http-readiness-bound.sh

      - name: Install template dependencies with PHP 8.4
        # The browser fixture renders Smarty only; it neither connects to MySQL
        # nor translates messages. Keep this image-only extension exception
        # narrow so Composer still validates every other production requirement.
        run: bash .github/scripts/run-static-php-container.sh install

      - name: Alias destinations render as text (stored-XSS regression)
        run: >-
          PHP_RENDERER="$GITHUB_WORKSPACE/.github/scripts/run-static-php-container.sh"
          CHROMIUM_BIN="$GITHUB_WORKSPACE/.github/scripts/run-headless-chrome.sh"
          bash tests/test-alias-destination-rendering.sh

      - name: Mailbox purge and log rendering (residual stored-XSS regression)
        run: >-
          PHP_RENDERER="$GITHUB_WORKSPACE/.github/scripts/run-static-php-container.sh"
          CHROMIUM_BIN="$GITHUB_WORKSPACE/.github/scripts/run-headless-chrome.sh"
          bash tests/test-residual-stored-xss-rendering.sh

      - name: Delegated confirm-guard blocks cancelled submits (VIM-D07)
        run: >-
          CHROMIUM_BIN="$GITHUB_WORKSPACE/.github/scripts/run-headless-chrome.sh"
          bash tests/test-confirm-guard-behaviour.sh

      - name: Source-defect sweep behaviour (VIM-A15.43, VIM-A15.44, VIM-A15.47)
        run: >-
          CHROMIUM_BIN="$GITHUB_WORKSPACE/.github/scripts/run-headless-chrome.sh"
          bash tests/test-source-defect-sweep-behaviour.sh

      - name: DataTables 3 runs without jQuery across source and bundle lanes
        run: >-
          CHROMIUM_BIN="$GITHUB_WORKSPACE/.github/scripts/run-headless-chrome.sh"
          bash tests/test-datatables-dependency-free-compat.sh

      - name: A stale JS URL fails and the maintained URL loads fresh
        env:
          CHROMIUM_BIN: >-
            ${{ github.workspace }}/.github/scripts/run-headless-chrome.sh
        run: bash ci/test-asset-cache-version-boundary.sh

      - name: Deliberately broken compatibility lane must fail on this engine
        run: bash tests/test-browser-engine-negative-control.sh

      - name: Native grouped validation clears stale sibling state (VIM-A15.56b)
        run: >-
          CHROMIUM_BIN="$GITHUB_WORKSPACE/.github/scripts/run-headless-chrome.sh"
          bash tests/test-native-validation-group-fixture.sh

      - name: Email-settings modal enforces native constraints (VIM-A15.56b)
        run: >-
          CHROMIUM_BIN="$GITHUB_WORKSPACE/.github/scripts/run-headless-chrome.sh"
          bash tests/test-email-settings-validation-fixture.sh

      - name: Migrated Bootstrap 5 controls operate in a browser (VIM-A15.25)
        run: >-
          PHP_RENDERER="$GITHUB_WORKSPACE/.github/scripts/run-static-php-container.sh"
          CHROMIUM_BIN="$GITHUB_WORKSPACE/.github/scripts/run-headless-chrome.sh"
          bash tests/test-control-behaviour-rendering.sh

  # ------------------------------------------------------------------ #
  # Framework-free service unit tests (Phase 1 of docs/ZF1-REMOVAL.md).#
  # No DB: the services depend on the minimal ObjectManager port and   #
  # are exercised against an in-memory fake + plain-PHP entities.      #
  # ------------------------------------------------------------------ #
  unit:
    name: Service unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            image: >-
              mirror.gcr.io/library/php@sha256:6cb44388b6ffc8c9a35b4cfdf518d0565e0cf9150e479add338b498874d7e971
          - php: '8.4'
            image: >-
              mirror.gcr.io/library/php@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3
          - php: '8.5'
            image: >-
              mirror.gcr.io/library/php@sha256:19667d836740e24a3ba340532c7349ab59bb961b86f20e3c85a58150644e5e55
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh

      - name: Trust checkout for tracked-test discovery
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null

      - name: Setup PHP container
        run: bash .github/scripts/setup-php-container.sh runtime

      - name: Install dependencies
        run: >-
          composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Run all framework-free PHP regression tests
        run: bash tests/run-unit-tests.sh

      - name: PHP support claims match the installable Composer contract
        run: php ci/test-php-version-contract.php

      - name: cURL is required by the installation contract
        run: php ci/test-curl-dependency-contract.php

      - name: MCP alias creation validates composed addresses
        run: php ci/test-mcp-alias-create.php

      - name: MCP mailbox creation enforces domain policy
        run: php ci/test-mcp-mailbox-create-policy.php

      - name: Controller string inputs preserve their transport contracts
        run: php ci/test-refactor-input-contract.php

      - name: Live adapters retain runtime discovery contracts
        run: php ci/test-refactor-autoload-contract.php

      - name: Equal list pagination adapters share one policy owner
        run: php ci/test-refactor-list-contract.php

      - name: Doveadm backend results retain one fail-closed transport owner
        run: php ci/test-refactor-doveadm-contract.php

      - name: Queue lifecycle destructive fixtures require a dedicated database
        run: php ci/test-refactor-queue-database-guard.php

      - name: Concrete controller resources retain one typed guard policy
        run: php ci/test-refactor-controller-resources.php

      - name: Shared list-modal markup preserves both rendered consumers
        run: php ci/test-refactor-list-templates.php

      - name: MCP domain defaults match GUI quota bytes
        run: php ci/test-mcp-domain-default-quota.php

      - name: MCP list responses expose complete pagination
        run: php ci/test-mcp-list-pagination.php

      - name: MCP requests reject duplicate JSON object members
        run: php ci/test-maintenance-rpc-duplicates.php

      - name: Empty INI parent sections retain inheritance shape
        run: php ci/test-ini-config-empty-parent.php

      - name: MCP enablement guide selects the loaded environment
        run: php ci/test-mcp-enable-config.php

      - name: Native routing preserves supported sub-path deployments
        run: php ci/test-subpath-routing.php

      - name: Domain alias counts link to the registered alias route
        run: php ci/test-domain-alias-count-route.php

      - name: Domain counter mutations retain their optimistic capacity guard
        run: php ci/test-domain-capacity-version.php

      - name: Quota forms accept their rendered file-size values
        run: php ci/test-quota-form-validation.php

      - name: CLI forwards queue one-batch mode
        run: php ci/test-cli-once-forwarding.php

      - name: Cron HOWTO queue contract
        run: php ci/test-cron-readme-queue-contract.php

      - name: Native schema derives the mailbox collation
        run: php ci/test-schema-collation-contract.php

      - name: Dovecot quota-clone matches the retired mailbox-size schema
        run: php ci/test-dovecot-quota-clone-contract.php

      - name: dovecot-storage-config-schema-contract-tests
        run: php ci/test-dovecot-storage-config-schema-contract.php

      - name: MCP orphan archive deletion enforces domain authorization
        run: php ci/test-mcp-archive-domain-authorization.php

      - name: MCP action routes retain the edge IP policy
        run: php ci/test-mcp-edge-routing.php

      - name: FPM health routes reach their loopback-only handlers
        run: php ci/test-fpm-health-routing.php

      - name: SMTP STARTTLS is fail-closed
        run: php ci/test-mailer-starttls.php

      - name: Bcrypt password length is fail-closed
        run: php ci/test-bcrypt-password-length.php

      - name: Password-reset bearer secrecy
        run: php ci/test-password-reset-bearer.php

      - name: Password-reset email displays its working URL
        run: php ci/test-password-reset-email-url.php

      - name: Password-reset links use a trusted origin
        run: php ci/test-password-reset-origin.php

      - name: Queue loopback bearer origin is pinned
        run: php ci/test-queue-loopback-origin.php

      - name: Second-factor guessing stops at the brute-force threshold
        run: php ci/test-second-factor-lockout.php

      - name: Brute-force cleanup retains live replacement generations
        run: php ci/test-maintenance-bruteforce-cleanup.php

  # ------------------------------------------------------------------ #
  # Dependency + cache wiring — proves a composer bump (symfony/cache, #
  # doctrine/orm) does not break the Doctrine cache layer at runtime.  #
  # Runs on every tested PHP minor: 8.3 through 8.5.
  # ------------------------------------------------------------------ #
  cache-wiring:
    name: Cache wiring (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            image: >-
              mirror.gcr.io/library/php@sha256:6cb44388b6ffc8c9a35b4cfdf518d0565e0cf9150e479add338b498874d7e971
          - php: '8.4'
            image: >-
              mirror.gcr.io/library/php@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3
          - php: '8.5'
            image: >-
              mirror.gcr.io/library/php@sha256:19667d836740e24a3ba340532c7349ab59bb961b86f20e3c85a58150644e5e55
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh

      - name: Setup PHP container
        run: bash .github/scripts/setup-php-container.sh cache

      - name: Install dependencies
        run: >-
          composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Verify locked Doctrine compatibility
        run: composer check-platform-reqs --no-dev

      - name: PHP runtime and dependency compatibility
        run: php ci/test-php-runtime.php

      - name: Verify portable proxy generation
        run: php ci/test-proxy-generation.php

      - name: Cache + ORM bootstrap smoke
        run: php -d apc.enable_cli=1 tests/test-cache-bootstrap.php

      - name: 'Native Doctrine EM factory (WALL #2)'
        run: php tests/test-kernel-em-factory.php

      - name: 'Native Smarty view (WALL #2)'
        run: php tests/test-kernel-smarty-view.php

      - name: OSS Smarty message rendering boundaries
        run: php tests/test-oss-message.php


  # ------------------------------------------------------------------ #
  # Schema drift — loads the shipped SQL into a real MariaDB and proves #
  # Attribute mappings have no pending changes (phantom-ALTER guard). #
  # ------------------------------------------------------------------ #
  schema-drift:
    name: Schema and atomic transitions (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            image: >-
              mirror.gcr.io/library/php@sha256:6cb44388b6ffc8c9a35b4cfdf518d0565e0cf9150e479add338b498874d7e971
          - php: '8.4'
            image: >-
              mirror.gcr.io/library/php@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3
          - php: '8.5'
            image: >-
              mirror.gcr.io/library/php@sha256:19667d836740e24a3ba340532c7349ab59bb961b86f20e3c85a58150644e5e55
    container:
      image: ${{ matrix.image }}
    services:
      mariadb:
        image: >-
          mirror.gcr.io/library/mariadb@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: vimbadmin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh

      - name: Setup PHP container
        run: bash .github/scripts/setup-php-container.sh runtime

      - name: Install dependencies
        run: >-
          composer install --no-interaction --no-progress --prefer-dist --no-dev

      # The self-hosted docker runner image ships no mysql client.
      - name: ensure mysql client
        run: |
          command -v mysql >/dev/null || {
            apt-get update
            apt-get install --yes --no-install-recommends mariadb-client
          }

      - name: Wait for MariaDB
        run: |
          for _ in $(seq 1 30); do
            if mysql -hmariadb -P3306 -uroot -pci \
              -e 'SELECT 1' >/dev/null 2>&1; then
              echo "MariaDB up"; break
            fi
            sleep 2
          done

      # Step 1: build schema from the attribute mappings and assert they are
      # self-consistent (schema-tool --force leaves nothing pending).
      - name: Build schema from mappings — assert no pending diff
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin
          DB_USER: root
          DB_PASS: ci
          SEED_ALIAS_COUNT_DRIFT: '1'
          VERIFY_FRESH_SCHEMA_COLLATION: '1'
        run: php tests/test-schema-no-pending.php

      # Step 2: layer the shipped fork SQL (FKs / collations / unique index /
      # non-mappable bits) via the mysql client, which handles the file's
      # PREPARE/EXECUTE guard blocks.
      - name: Apply shipped fork migration SQL
        run: >-
          mysql -hmariadb -P3306 -uroot -pci vimbadmin
          < contrib/migrations/2026-06-fork-schema.sql

      # Step 3: re-diff WITHOUT recreating. This proves the fork SQL did not
      # push the DB out of sync with the mappings (phantom-ALTER regression).
      - name: After fork SQL — assert still no pending diff
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin
          DB_USER: root
          DB_PASS: ci
          SKIP_CREATE: '1'
          VERIFY_ALIAS_COUNT_RECONCILIATION: '1'
          VERIFY_NATIVE_COLLATION_ALIGNMENT: '1'
        run: php tests/test-schema-no-pending.php

      - name: Reapply fork SQL — alias-count reconciliation stays idempotent
        run: >-
          mysql -hmariadb -P3306 -uroot -pci vimbadmin
          < contrib/migrations/2026-06-fork-schema.sql

      - name: After second fork SQL — alias counts remain reconciled
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin
          DB_USER: root
          DB_PASS: ci
          SKIP_CREATE: '1'
          VERIFY_ALIAS_COUNT_RECONCILIATION: '1'
        run: php tests/test-schema-no-pending.php

      - name: Provision dedicated service audit-log database
        run: >-
          mysql -hmariadb -P3306 -uroot -pci -e
          "CREATE DATABASE \`vimbadmin_service_audit_log\`
          CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Service audit-log construction preserves caller ownership
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin_service_audit_log
          DB_USER: root
          DB_PASS: ci
          VIMBADMIN_SERVICE_AUDIT_DB: '1'
        run: php ci/test-refactor-service-audit-log.php

      - name: Mailbox-task enqueue is atomic under concurrent transactions
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin
          DB_USER: root
          DB_PASS: ci
          VIMBADMIN_DESTRUCTIVE_DB_TESTS: '1'
        run: php tests/test-mailbox-queue-atomic-mariadb.php

      - name: One-time second factors are atomic across database sessions
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin
          DB_USER: root
          DB_PASS: ci
          VIMBADMIN_DESTRUCTIVE_DB_TESTS: '1'
        run: php ci/test-two-factor-atomic-mariadb.php

      - name: Password-reset proofs are atomic across database sessions
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin
          DB_USER: root
          DB_PASS: ci
          VIMBADMIN_DESTRUCTIVE_DB_TESTS: '1'
        run: php ci/test-password-reset-atomic-mariadb.php

      - name: Domain capacity transitions are atomic across database sessions
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin
          DB_USER: root
          DB_PASS: ci
          VIMBADMIN_DESTRUCTIVE_DB_TESTS: '1'
        run: php ci/test-domain-capacity-atomic-mariadb.php

      - name: Authorization-scoped preference caches follow access changes
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin
          DB_USER: root
          DB_PASS: ci
          VIMBADMIN_DESTRUCTIVE_DB_TESTS: '1'
        run: php ci/test-access-cache-invalidation.php

      - name: Terminal task state remains fenced across cleanup and rollback
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin
          DB_USER: root
          DB_PASS: ci
          VIMBADMIN_DESTRUCTIVE_DB_TESTS: '1'
        run: php ci/test-maintenance-task-ownership.php

      - name: Provision dedicated queue lifecycle database
        run: >-
          mysql -hmariadb -P3306 -uroot -pci -e
          "CREATE DATABASE \`vimbadmin_queue_lifecycle_test\`
          CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Actual queue execution retains ownership
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin_queue_lifecycle_test
          DB_USER: root
          DB_PASS: ci
          VIMBADMIN_DESTRUCTIVE_DB_TESTS: '1'
        run: php ci/test-refactor-queue-lifecycle.php

      - name: Retry requires the exact safely failed task generation
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin
          DB_USER: root
          DB_PASS: ci
          VIMBADMIN_DESTRUCTIVE_DB_TESTS: '1'
        run: php ci/test-maintenance-task-retry.php

      - name: Mail-store claims survive contention and uncertain completion
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin
