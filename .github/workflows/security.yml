name: Security scan (SAST)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly re-scan so new Semgrep rules catch latent issues.
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ["self-hosted-run-${{ github.run_id }}-${{ github.run_attempt }}", "vimbadmin-owned-local-v1-run-${{ github.run_id }}-${{ github.run_attempt }}", "docker-run-${{ github.run_id }}-${{ github.run_attempt }}", "jit-env-input-run-${{ github.run_id }}-${{ github.run_attempt }}", "vimbadmin-pristine-jit-v1-run-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 20
    outputs:
      sarif-artifact-id: ${{ steps.sarif_artifact.outputs.artifact-id }}
    # CodeQL has no PHP support; Semgrep is the SAST engine for this codebase.
    container:
      # Published after reset; placement metadata only, never host credentials.
      volumes:
        - /run/myguard-ci-slot:/run/myguard-ci-slot:ro
      image: >-
        semgrep/semgrep@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh
        env:
          PR_RUNNER_EXPECTED_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Trust checkout for Semgrep Git operations
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null

      - name: Test Semgrep baseline event policy
        run: bash tests/test-semgrep-baseline.sh

      - name: Test immutable Semgrep rule policy
        run: python3 tests/test-semgrep-rule-lock.py

      - name: Verify locked Semgrep findings fail the job (negative control)
        id: semgrep_locked_negative
        if: github.event_name == 'pull_request'
        run: >-
          bash .github/scripts/assert-semgrep-findings.sh
          --config .semgrep/locked

      - name: Verify current Semgrep findings fail the job (negative control)
        id: semgrep_current_negative
        if: github.event_name != 'pull_request'
        run: >-
          bash .github/scripts/assert-semgrep-findings.sh
          --config p/php
          --config p/security-audit
          --config p/secrets

      - name: Run locked Semgrep rules for pull requests
        id: semgrep_locked
        if: github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          baseline=$(bash .github/scripts/select-semgrep-baseline.sh \
            "$EVENT_NAME" "$PR_BASE_SHA" "$BEFORE_SHA" "$HEAD_SHA")
          baseline_args=()
          if [[ -n $baseline ]]; then
            baseline_args=(--baseline-commit "$baseline")
          fi
          semgrep scan \
            --config .semgrep/locked \
            --exclude '.semgrep/locked/**' \
            --sarif --output semgrep.sarif \
            "${baseline_args[@]}" \
            --error

      - name: Run current Semgrep rules outside pull requests
        id: semgrep_current
        if: github.event_name != 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          baseline=$(bash .github/scripts/select-semgrep-baseline.sh \
            "$EVENT_NAME" "$PR_BASE_SHA" "$BEFORE_SHA" "$HEAD_SHA")
          baseline_args=()
          if [[ -n $baseline ]]; then
            baseline_args=(--baseline-commit "$baseline")
          fi
          semgrep scan \
            --config p/php \
            --config p/security-audit \
            --config p/secrets \
            --exclude '.semgrep/locked/**' \
            --sarif --output semgrep.sarif \
            "${baseline_args[@]}" \
            --error

      # Always preserve the scan result, including a failing non-PR scan.
      # The immutable artifact ID binds the consumer to this job and run.
      - name: Preserve SARIF for non-PR upload
        id: sarif_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.event_name != 'pull_request'
        with:
          name: semgrep-${{ github.sha }}-${{ github.run_attempt }}
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: 1

  sarif-upload:
    name: Publish non-PR SARIF
    # PR code never receives the Security write token. No cross-run artifacts.
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.semgrep.outputs.sarif-artifact-id != ''
    needs: semgrep
    runs-on: ["self-hosted-run-${{ github.run_id }}-${{ github.run_attempt }}", "vimbadmin-owned-local-v1-run-${{ github.run_id }}-${{ github.run_attempt }}", "docker-run-${{ github.run_id }}-${{ github.run_attempt }}", "jit-env-input-run-${{ github.run_id }}-${{ github.run_attempt }}", "vimbadmin-pristine-jit-v1-run-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # Only this non-PR job uploads SARIF.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert pull-request runner isolation
        run: bash .github/scripts/assert-pr-runner-isolation.sh
        env:
          PR_RUNNER_EXPECTED_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download this run's scan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.semgrep.outputs.sarif-artifact-id }}
          path: sarif
          merge-multiple: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # yamllint disable-line rule:line-length
        with:
          sarif_file: sarif/semgrep.sarif
          category: semgrep
